name: Alerte NRJ

on:
  schedule:
    - cron: "*/5 * * * *"   # relance toutes les 5 min ; chaque exécution vérifie NRJ chaque minute
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de test sur Telegram"
        type: boolean
        default: false

concurrency:
  group: nrj-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer l'état (titres déjà signalés)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}
          restore-keys: nrj-state-

      - name: Surveiller NRJ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTISTS: ${{ vars.ARTISTS }}
          LOOP_MINUTES: "4"
          POLL_SECONDS: "60"
        run: python bot.py ${{ inputs.test && '--test' || '' }}

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}
