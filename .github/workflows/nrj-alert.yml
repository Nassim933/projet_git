name: Alerte NRJ

on:
  schedule:
    - cron: "*/5 * * * *"   # filet de sécurité : une exécution vérifie NRJ chaque minute pendant 20 min, la suivante attend dans la file
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de test sur Telegram"
        type: boolean
        default: false
      artistes:
        description: "Artistes à surveiller pour cette exécution (vide = réglage habituel)"
        type: string
        default: ""

concurrency:
  group: nrj-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer l'état (titres déjà signalés)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}
          restore-keys: nrj-state-

      - name: Surveiller NRJ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTISTS: ${{ inputs.artistes || vars.ARTISTS }}
          LOOP_MINUTES: "20"
          POLL_SECONDS: "60"
        run: python bot.py ${{ inputs.test && '--test' || '' }}

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}
