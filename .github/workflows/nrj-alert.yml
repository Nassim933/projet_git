name: Alerte NRJ

on:
  schedule:
    # Filet de sécurité seulement : GitHub espace beaucoup ces lancements (parfois 1 par heure ou moins).
    # La surveillance continue vient de l'auto-relance en fin de job (voir dernière étape).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de test sur Telegram"
        type: boolean
        default: false
      diagnostic:
        description: "Afficher les données brutes reçues de NRJ (dépannage)"
        type: boolean
        default: false
      artistes:
        description: "Artistes à surveiller pour cette exécution (vide = réglage habituel)"
        type: string
        default: ""

concurrency:
  group: nrj-alert-${{ inputs.diagnostic && 'diag' || 'surveillance' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # nécessaire pour que le job se relance lui-même

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer l'état (titres déjà signalés)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}
          restore-keys: nrj-state-

      - name: Surveiller NRJ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTISTS: ${{ inputs.artistes || vars.ARTISTS }}
          LOOP_MINUTES: "55"
          POLL_SECONDS: "60"
        run: python bot.py ${{ inputs.test && '--test' || '' }} ${{ inputs.diagnostic && '--debug' || '' }}

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: nrj-state-${{ github.run_id }}

      - name: Relancer la surveillance (boucle continue)
        if: ${{ !cancelled() && !inputs.test && !inputs.diagnostic }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nrj-alert.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
